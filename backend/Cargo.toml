[package]
name = "massflowcal"
version = "0.1.0"
edition = "2021"
description = "Mass Flow Calculator - Material Balance Desktop App"

[dependencies]
eframe = "0.33"
egui = "0.33"
egui-snarl = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
petgraph = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
