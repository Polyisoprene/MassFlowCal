[package]
name = "mfc-persistence"
version = "0.1.0"
edition = "2021"
description = "MassFlowCal persistence layer (SQLite, project files)"

[dependencies]
mfc-core = { path = "../mfc-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
