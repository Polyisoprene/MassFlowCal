[package]
name = "mfc-gui"
version = "0.1.0"
edition = "2021"
description = "MassFlowCal egui desktop application"

[[bin]]
name = "massflowcal"
path = "src/main.rs"

[dependencies]
mfc-core = { path = "../mfc-core" }
mfc-engine = { path = "../mfc-engine" }
mfc-persistence = { path = "../mfc-persistence" }
eframe = "0.33"
egui = "0.33"
egui-ariel = { path = "../../egui-ariel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
